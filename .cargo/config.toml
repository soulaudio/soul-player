# Cargo Configuration for Soul Player
# See: https://doc.rust-lang.org/cargo/reference/config.html

[alias]
xtask = "run --package xtask --"
xt = "run --package xtask --"

[build]
# Use project-local target directory for better hot reload detection
# This will be overridden by CARGO_TARGET_DIR env var if set
target-dir = "target"

[profile.dev]
# DISABLE incremental compilation for guaranteed fresh builds in dev mode
# This ensures all library changes are detected and rebuilt
incremental = false
opt-level = 0
debug = true

[profile.dev.build-override]
# Also disable incremental for build scripts
incremental = false
opt-level = 0

[term]
# Colorize output
color = 'auto'
verbose = false

# Platform-specific settings can be added here if needed
# Example: [target.x86_64-pc-windows-msvc]
#          rustflags = ["-C", "target-cpu=native"]
