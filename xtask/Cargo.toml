[package]
name = "xtask"
version = "0.1.10"
edition = "2021"
publish = false

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive", "cargo", "color"] }

# JSON serialization for metrics export
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Colored terminal output
colored = "2.1"

# Error handling
anyhow = "1.0"

# Process execution
which = "6.0"

# File system operations
tempfile = "3.24"
walkdir = "2.5"

# Audio file generation
hound = "3.5"

# Timestamps for metrics
chrono = "0.4"

# TOML editing (preserves formatting)
toml_edit = "0.22"

# Git operations
git2 = "0.20"

# Platform detection
os_info = "3.8"
sys-info = "0.9"

# File watching
notify = "6.1"

# Regex for validation
regex = "1.10"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Directory path helpers
dirs = "5.0"

[lints]
workspace = true
