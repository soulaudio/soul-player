# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
# All advisory types (vulnerability, unmaintained, unsound, notice) are deny by default
# Use ignore = ["RUSTSEC-YYYY-XXXX"] to selectively ignore specific advisories
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignored advisories - transitive dependencies we can't control
# We'll track upstream updates for fixes
ignore = [
    # Unmaintained unic-* crates from Tauri's urlpattern dependency
    "RUSTSEC-2025-0075",  # unic-char-range unmaintained (via urlpattern -> Tauri)
    "RUSTSEC-2025-0080",  # unic-common unmaintained (via urlpattern -> Tauri)
    "RUSTSEC-2025-0081",  # unic-char-property unmaintained (via urlpattern -> Tauri)
    "RUSTSEC-2025-0098",  # unic-ucd-version unmaintained (via urlpattern -> Tauri)
    "RUSTSEC-2025-0100",  # unic-ucd-ident unmaintained (via urlpattern -> Tauri)

    # Unmaintained crates from Tauri's GTK/UI dependencies (Linux only)
    "RUSTSEC-2024-0370",  # proc-macro-error unmaintained (via glib-macros -> GTK -> Tauri)
    "RUSTSEC-2024-0411",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0412",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0413",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0414",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0415",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0416",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0417",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0418",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0419",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0420",  # gtk-rs GTK3 bindings unmaintained (via Tauri Linux)
    "RUSTSEC-2024-0436",  # paste unmaintained (via Tauri dependencies)

    # Other unmaintained transitive dependencies
    "RUSTSEC-2024-0384",  # instant unmaintained (via Tauri)
    "RUSTSEC-2025-0057",  # fxhash unmaintained (via dependencies)
    "RUSTSEC-2025-0119",  # number_prefix unmaintained (via indicatif)

    # Unmaintained crates from reqwest/testcontainers
    "RUSTSEC-2025-0111",  # tokio-tar CVE-2025-62518 (dev-only via testcontainers)
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained (via reqwest/testcontainers)
]

[licenses]
# Soul Player is licensed under AGPL-3.0, which is compatible with all licenses below
# Permissive licenses (MIT, Apache, BSD, ISC, Zlib, CC0) can be combined with AGPL
# MPL-2.0 is a weak copyleft license that's also compatible with AGPL-3.0
allow = [
    "AGPL-3.0-only",       # Soul Player's license
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",        # Permissive license (similar to MIT)
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",         # Unicode License v3 (OSI approved)
    "Zlib",                # Permissive license (similar to MIT)
    "CC0-1.0",             # Public domain dedication
    "MPL-2.0",             # Mozilla Public License (weak copyleft, AGPL-compatible)
    "CDLA-Permissive-2.0", # Community Data License (for TLS root certificates)
]

[bans]
multiple-versions = "warn"
# Allow workspace dependencies (cargo-deny incorrectly flags { workspace = true } as wildcards)
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
