name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        type: string
      triggered_by_ci:
        description: 'Triggered by CI (internal use)'
        required: false
        type: string
        default: 'false'
      commit_sha:
        description: 'Commit SHA from CI'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Optimize for release builds
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: 'thin'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1

jobs:
  # ============================================================================
  # Stage 0: Try to Download CI Artifacts (if triggered by CI)
  # ============================================================================

  check-ci-artifacts:
    name: Check CI Artifacts
    runs-on: ubuntu-latest
    outputs:
      has_artifacts: ${{ steps.check.outputs.has_artifacts }}
    steps:
      - name: Check if CI artifacts exist
        id: check
        run: |
          if [ "${{ inputs.triggered_by_ci }}" = "true" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            echo "✅ Will reuse CI build artifacts"
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Will build from scratch"
          fi

  # ============================================================================
  # Stage 1: Build All Platforms (or Reuse CI Artifacts)
  # ============================================================================

  build-windows:
    name: Build Windows Installers
    needs: check-ci-artifacts
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      # Try to download CI artifacts first
      - name: Download CI artifacts
        if: needs.check-ci-artifacts.outputs.has_artifacts == 'true'
        uses: actions/download-artifact@v4
        with:
          name: soul-player-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
        continue-on-error: true

      # Only build if artifacts weren't downloaded
      - name: Check if build needed
        id: check-build
        shell: bash
        run: |
          if [ -f "target/${{ matrix.target }}/release/soul-player.exe" ]; then
            echo "build_needed=false" >> $GITHUB_OUTPUT
            echo "✅ Using CI build artifacts"
          else
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "ℹ️  Building from source"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check-build.outputs.build_needed == 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: steps.check-build.outputs.build_needed == 'true'
        with:
          cache-on-failure: true

      # Install LLVM for ASIO support
      - name: Install LLVM
        if: steps.check-build.outputs.build_needed == 'true'
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Setup Node.js
        if: steps.check-build.outputs.build_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack for Yarn
        if: steps.check-build.outputs.build_needed == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.check-build.outputs.build_needed == 'true'
        run: yarn

      - name: Build installers (MSI + NSIS)
        if: steps.check-build.outputs.build_needed == 'true'
        run: yarn build:desktop --bundles msi nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            applications/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            applications/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 30

  build-linux:
    name: Build Linux Packages
    needs: check-ci-artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      # Free up disk space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      # Try to download CI artifacts first
      - name: Download CI artifacts
        if: needs.check-ci-artifacts.outputs.has_artifacts == 'true'
        uses: actions/download-artifact@v4
        with:
          name: soul-player-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
        continue-on-error: true

      - name: Check if build needed
        id: check-build
        run: |
          if [ -f "target/${{ matrix.target }}/release/soul-player" ]; then
            echo "build_needed=false" >> $GITHUB_OUTPUT
            echo "✅ Using CI build artifacts"
          else
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "ℹ️  Building from source"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check-build.outputs.build_needed == 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: steps.check-build.outputs.build_needed == 'true'
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        if: steps.check-build.outputs.build_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack for Yarn
        if: steps.check-build.outputs.build_needed == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.check-build.outputs.build_needed == 'true'
        run: yarn

      - name: Build packages (DEB + RPM)
        if: steps.check-build.outputs.build_needed == 'true'
        run: yarn build:desktop --bundles deb rpm
        continue-on-error: false

      - name: Build AppImage (optional)
        if: steps.check-build.outputs.build_needed == 'true'
        run: yarn build:desktop --bundles appimage
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: |
            applications/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            applications/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            applications/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          retention-days: 30

  build-macos:
    name: Build macOS Packages
    needs: check-ci-artifacts
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      # Try to download CI artifacts first
      - name: Download CI artifacts
        if: needs.check-ci-artifacts.outputs.has_artifacts == 'true'
        uses: actions/download-artifact@v4
        with:
          name: soul-player-${{ matrix.target }}
          path: target/${{ matrix.target }}/release
        continue-on-error: true

      - name: Check if build needed
        id: check-build
        run: |
          if [ -f "target/${{ matrix.target }}/release/soul-player" ]; then
            echo "build_needed=false" >> $GITHUB_OUTPUT
            echo "✅ Using CI build artifacts"
          else
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "ℹ️  Building from source"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check-build.outputs.build_needed == 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        if: steps.check-build.outputs.build_needed == 'true'
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: brew install pkg-config

      - name: Setup Node.js
        if: steps.check-build.outputs.build_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack for Yarn
        if: steps.check-build.outputs.build_needed == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.check-build.outputs.build_needed == 'true'
        run: yarn

      - name: Build DMG
        if: steps.check-build.outputs.build_needed == 'true'
        run: yarn build:desktop --bundles dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            applications/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            applications/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          retention-days: 30

