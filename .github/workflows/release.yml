name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false
        type: string
      triggered_by_ci:
        description: 'Triggered by CI (internal use)'
        required: false
        type: string
        default: 'false'
      commit_sha:
        description: 'Commit SHA from CI'
        required: false
        type: string

# Prevent concurrent release builds
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Optimize for release builds
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: 'thin'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1

jobs:
  # ============================================================================
  # Stage 0a: Check if Release Already Exists
  # ============================================================================

  check-release-exists:
    name: Check if Release Exists
    runs-on: ubuntu-latest
    outputs:
      should_continue: ${{ steps.check-release.outputs.should_continue }}
    steps:
      - name: Check if release already exists for this tag
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          echo "Checking if release exists for tag: $TAG"
          echo ""

          # Check if release exists (draft or published)
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            # Get release details
            RELEASE_INFO=$(gh release view "$TAG" --repo ${{ github.repository }} --json isDraft,isPrerelease,publishedAt,createdAt)
            IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')
            IS_PRERELEASE=$(echo "$RELEASE_INFO" | jq -r '.isPrerelease')
            PUBLISHED_AT=$(echo "$RELEASE_INFO" | jq -r '.publishedAt')
            CREATED_AT=$(echo "$RELEASE_INFO" | jq -r '.createdAt')

            echo "⚠️  Release already exists for tag $TAG"
            echo ""
            echo "Release details:"
            echo "  - Created: $CREATED_AT"

            if [ "$IS_DRAFT" = "true" ]; then
              echo "  - Status: DRAFT (not yet published)"
            elif [ "$IS_PRERELEASE" = "true" ]; then
              echo "  - Status: PRE-RELEASE"
              echo "  - Published: $PUBLISHED_AT"
            else
              echo "  - Status: PUBLISHED"
              echo "  - Published: $PUBLISHED_AT"
            fi

            echo ""
            echo "🛑 Stopping workflow to avoid duplicate work"
            echo "   If this is unexpected, delete the release with:"
            echo "   gh release delete $TAG --yes --cleanup-tag"
            echo ""
            echo "View release: https://github.com/${{ github.repository }}/releases/tag/$TAG"

            echo "should_continue=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "✅ No existing release found for tag $TAG"
            echo "✅ Proceeding with release creation"
            echo "should_continue=true" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Stage 0b: Try to Download CI Artifacts (if triggered by CI)
  # ============================================================================

  check-ci-artifacts:
    name: Check CI Artifacts
    needs: check-release-exists
    if: needs.check-release-exists.outputs.should_continue == 'true'
    runs-on: ubuntu-latest
    outputs:
      has_artifacts: ${{ steps.check.outputs.has_artifacts }}
    steps:
      - name: Check if CI artifacts exist
        id: check
        run: |
          if [ "${{ inputs.triggered_by_ci }}" = "true" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            echo "✅ Will reuse CI build artifacts"
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Will build from scratch"
          fi

  # ============================================================================
  # Stage 1: Build All Platforms (or Reuse CI Artifacts)
  # ============================================================================

  build-windows:
    name: Build Windows Installers
    needs: [check-release-exists, check-ci-artifacts]
    if: needs.check-release-exists.outputs.should_continue == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Install LLVM for ASIO support
      - name: Install LLVM
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack for Yarn
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn

      - name: Debug - Check dist folder before build
        shell: bash
        run: |
          echo "=== Checking if dist folder will be created correctly ==="
          echo "Current directory: $(pwd)"
          echo "Listing applications/desktop:"
          ls -la applications/desktop/ || echo "applications/desktop not found"

          echo ""
          echo "Checking from src-tauri perspective (where frontendDist is relative to):"
          cd applications/desktop/src-tauri
          echo "Current directory: $(pwd)"
          echo "frontendDist path (../dist) resolves to: $(realpath ../dist || echo 'path does not exist yet')"
          cd ../../..

      - name: Build frontend
        run: |
          cd applications/desktop
          yarn build
          node copy-dist.cjs

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn build:desktop --target ${{ matrix.target }} --bundles nsis

      - name: Debug - Verify dist folder after build
        shell: bash
        run: |
          echo "=== Checking dist folder after Tauri build ==="
          if [ -d "applications/desktop/dist" ]; then
            echo "✅ dist folder exists"
            echo "Contents:"
            find applications/desktop/dist -type f -exec echo "  {}" \;
            echo ""
            echo "HTML files:"
            find applications/desktop/dist -name "*.html" -exec ls -lh {} \;
          else
            echo "❌ dist folder NOT found!"
            echo "Listing applications/desktop:"
            ls -la applications/desktop/
          fi

          echo ""
          echo "=== Checking src-tauri/dist (where Tauri reads from) ==="
          if [ -d "applications/desktop/src-tauri/dist" ]; then
            echo "✅ src-tauri/dist folder exists"
            echo "Contents:"
            find applications/desktop/src-tauri/dist -type f -exec echo "  {}" \;
            echo ""
            echo "HTML files:"
            find applications/desktop/src-tauri/dist -name "*.html" -exec ls -lh {} \;
          else
            echo "❌ src-tauri/dist folder NOT found!"
            echo "This is the critical issue - Tauri can't embed files if they're not here"
          fi

      - name: Validate NSIS installer contains frontend files
        shell: bash
        run: |
          echo "Validating NSIS bundle contains frontend files..."
          NSIS=$(find target/${{ matrix.target }}/release/bundle/nsis -name "*.exe" | head -1)

          if [ -z "$NSIS" ]; then
            echo "❌ ERROR: No NSIS installer found"
            exit 1
          fi

          echo "✅ NSIS installer found: $NSIS"

          # Verify frontend dist folder exists before bundling
          if [ ! -d "applications/desktop/dist" ]; then
            echo "❌ ERROR: Frontend dist folder not found before bundling"
            exit 1
          fi

          # Check for HTML files in dist
          HTML_FILES=$(find applications/desktop/dist -name "*.html" | wc -l)
          JS_FILES=$(find applications/desktop/dist -name "*.js" | wc -l)

          if [ "$HTML_FILES" -eq 0 ] || [ "$JS_FILES" -eq 0 ]; then
            echo "❌ ERROR: Frontend files missing from dist folder"
            echo "HTML files: $HTML_FILES, JS files: $JS_FILES"
            exit 1
          fi

          echo "✅ Frontend validation passed"
          echo "Found $HTML_FILES HTML files and $JS_FILES JS files"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
          retention-days: 30

  build-linux-tauri:
    name: Build Linux Base (DEB + RPM)
    needs: [check-release-exists, check-ci-artifacts]
    if: needs.check-release-exists.outputs.should_continue == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      # Free up disk space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack for Yarn
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn

      - name: Build frontend
        run: |
          cd applications/desktop
          yarn build
          node copy-dist.cjs

      - name: Build packages (DEB + RPM)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn build:desktop --target ${{ matrix.target }} --bundles deb rpm
        continue-on-error: false

      - name: Validate packages contain frontend files
        run: |
          echo "Validating packages contain frontend files..."

          # Check if frontend dist folder exists
          if [ ! -d "applications/desktop/dist" ]; then
            echo "❌ ERROR: Frontend dist folder not found"
            exit 1
          fi

          # Check for HTML and JS files in dist
          HTML_FILES=$(find applications/desktop/dist -name "*.html" | wc -l)
          JS_FILES=$(find applications/desktop/dist -name "*.js" | wc -l)

          if [ "$HTML_FILES" -eq 0 ] || [ "$JS_FILES" -eq 0 ]; then
            echo "❌ ERROR: Frontend files missing from dist folder"
            echo "HTML files: $HTML_FILES, JS files: $JS_FILES"
            exit 1
          fi

          echo "✅ Frontend validation passed"
          echo "Found $HTML_FILES HTML files and $JS_FILES JS files"

      - name: Upload binary for AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/soul-player
          retention-days: 1

      - name: Upload DEB + RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-tauri-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig
          retention-days: 30

  build-linux-appimage:
    name: Build Linux AppImage
    needs: [check-release-exists, build-linux-tauri]
    if: needs.check-release-exists.outputs.should_continue == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-binary-${{ matrix.target }}
          path: target/release/

      - name: Make binary executable
        run: chmod +x target/release/soul-player

      - name: Cache linuxdeploy
        uses: actions/cache@v4
        with:
          path: linuxdeploy-x86_64.AppImage
          key: linuxdeploy-continuous

      - name: Build AppImage
        run: |
          echo "Building AppImage..."

          # Get version from release config
          VERSION=$(jq -r '.version' .github/release-config.json)

          # Binary is already in target/release/ from artifact download
          # Install linuxdeploy if needed
          if [ ! -f "linuxdeploy-x86_64.AppImage" ]; then
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage
          fi

          # Build AppImage using our script
          chmod +x .appimage/build-appimage.sh
          ./.appimage/build-appimage.sh "$VERSION"

          echo "✅ AppImage created"

      - name: Upload AppImage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.target }}
          path: |
            soul-player_*.AppImage
            soul-player_*.AppImage.sha256
          retention-days: 30

  build-linux-flatpak:
    name: Build Linux Flatpak
    needs: [check-release-exists]
    if: needs.check-release-exists.outputs.should_continue == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      # Free up disk space for Flatpak build
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install Flatpak build dependencies
        run: |
          echo "Installing Flatpak build tools..."

          # Install flatpak and flatpak-builder
          sudo apt-get install -y flatpak flatpak-builder

          # Add Flathub repository
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

          # Install GNOME runtime and SDK
          sudo flatpak install -y flathub org.gnome.Platform//45 org.gnome.Sdk//45

          # Install SDK extensions for Rust and Node.js
          sudo flatpak install -y flathub org.freedesktop.Sdk.Extension.rust-stable//23.08 || true
          sudo flatpak install -y flathub org.freedesktop.Sdk.Extension.node20//23.08 || true

          echo "✅ Flatpak build environment ready"

      - name: Build Flatpak
        run: |
          echo "Building Flatpak..."

          # Get version from release config
          VERSION=$(jq -r '.version' .github/release-config.json)

          # Build Flatpak using our script
          chmod +x .flatpak/build-flatpak.sh
          echo "n" | ./.flatpak/build-flatpak.sh "$VERSION"

          echo "✅ Flatpak created"

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak
          path: |
            io.github.soulaudio.SoulPlayer_*.flatpak
            io.github.soulaudio.SoulPlayer_*.flatpak.sha256
          retention-days: 30

  build-macos:
    name: Build macOS Packages
    needs: [check-release-exists, check-ci-artifacts]
    if: needs.check-release-exists.outputs.should_continue == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: brew install pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack for Yarn
        run: corepack enable

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn

      - name: Build frontend
        run: |
          cd applications/desktop
          yarn build
          node copy-dist.cjs

      - name: Build DMG with ad-hoc code signing
        env:
          # Tauri updater signing (for auto-updates, not macOS code signing)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # ============================================================================
          # macOS Code Signing Strategy: Ad-Hoc Signing (Free, No Apple Developer Account)
          # ============================================================================
          #
          # CURRENT APPROACH: Ad-Hoc Signing with Hardened Runtime
          # - Configured in tauri.conf.json: signingIdentity: "-"
          # - App is signed with ad-hoc signature and hardened runtime
          # - Includes proper entitlements (entitlements.plist)
          # - Users may still see Gatekeeper warning on first launch
          # - Users should right-click → Open to bypass the warning
          # - After first open, app launches normally
          #
          # WHY THIS APPROACH:
          # - Free (no $99/year Apple Developer Program required)
          # - Prevents "app is damaged" error with proper configuration
          # - Suitable for open-source projects with manual installation
          # - Better than no signing at all
          #
          # USER WORKAROUND (if still seeing "damaged" error):
          # Users can run: xattr -cr "/Applications/Soul Player.app"
          # This removes quarantine attributes from downloaded apps
          #
          # UPGRADING TO NOTARIZATION (Future):
          # To fully remove warnings, add these secrets and uncomment below:
          #   - APPLE_CERTIFICATE (base64 encoded .p12 Developer ID cert)
          #   - APPLE_CERTIFICATE_PASSWORD
          #   - APPLE_ID (Apple account email)
          #   - APPLE_PASSWORD (app-specific password)
          #   - APPLE_TEAM_ID (from App Store Connect)
          #
          # Then add before this step:
          #   - name: Import Code Signing Certificate
          #     env:
          #       APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          #       APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          #     run: |
          #       echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          #       security create-keychain -p actions build.keychain
          #       security default-keychain -s build.keychain
          #       security unlock-keychain -p actions build.keychain
          #       security import certificate.p12 -k build.keychain -P $APPLE_CERTIFICATE_PASSWORD -T /usr/bin/codesign
          #       security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          #
          # And update signingIdentity in tauri.conf.json to your certificate name:
          #   "signingIdentity": "Developer ID Application: Your Name (TEAMID)"
          #
          # And add these environment variables to this step:
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # REFERENCE: https://v2.tauri.app/distribute/sign/macos/
          # ============================================================================

          # Build DMG (Rust binary with embedded frontend)
          # Ad-hoc signing configured in tauri.conf.json
          yarn build:desktop --target ${{ matrix.target }} --bundles dmg

      - name: Verify code signature
        run: |
          echo "Verifying code signature of built app..."

          # Find the .app bundle
          APP_BUNDLE=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)

          if [ -z "$APP_BUNDLE" ]; then
            echo "❌ ERROR: No .app bundle found"
            exit 1
          fi

          echo "Found app bundle: $APP_BUNDLE"
          echo ""

          # Verify signature
          echo "Checking code signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE" || {
            echo "⚠️  Code signature verification failed"
            echo ""
            echo "Displaying signature information:"
            codesign -dv --verbose=4 "$APP_BUNDLE"
            echo ""
            echo "This is expected for ad-hoc signing. Checking if ad-hoc signature is present..."
            if codesign -dv "$APP_BUNDLE" 2>&1 | grep -q "Signature=adhoc"; then
              echo "✅ Ad-hoc signature detected (expected for free signing)"
            else
              echo "❌ ERROR: No signature found at all"
              exit 1
            fi
          }

          # Display signature info
          echo ""
          echo "Code signature details:"
          codesign -dv --verbose=4 "$APP_BUNDLE"

          # Check entitlements
          echo ""
          echo "Checking entitlements..."
          codesign -d --entitlements :- "$APP_BUNDLE" || echo "⚠️  No entitlements found (may be okay for ad-hoc signing)"

          echo ""
          echo "✅ Code signature verification complete"

      - name: Validate DMG contains frontend files
        run: |
          echo "Validating DMG bundle contains frontend files..."
          DMG=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)

          if [ -z "$DMG" ]; then
            echo "❌ ERROR: No DMG file found"
            exit 1
          fi

          # Check if frontend dist folder exists
          if [ ! -d "applications/desktop/dist" ]; then
            echo "❌ ERROR: Frontend dist folder not found"
            exit 1
          fi

          # Check for HTML and JS files in dist
          HTML_FILES=$(find applications/desktop/dist -name "*.html" | wc -l)
          JS_FILES=$(find applications/desktop/dist -name "*.js" | wc -l)

          if [ "$HTML_FILES" -eq 0 ] || [ "$JS_FILES" -eq 0 ]; then
            echo "❌ ERROR: Frontend files missing from dist folder"
            echo "HTML files: $HTML_FILES, JS files: $JS_FILES"
            exit 1
          fi

          echo "✅ Frontend validation passed"
          echo "Found $HTML_FILES HTML files and $JS_FILES JS files"

          # Also check the .app bundle if possible
          APP_BUNDLE=$(find target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            echo ""
            echo "Checking .app bundle structure..."
            if [ -d "$APP_BUNDLE/Contents/Resources" ]; then
              BUNDLE_HTML=$(find "$APP_BUNDLE/Contents/Resources" -name "*.html" | wc -l)
              BUNDLE_JS=$(find "$APP_BUNDLE/Contents/Resources" -name "*.js" | wc -l)
              echo "App bundle contains $BUNDLE_HTML HTML files and $BUNDLE_JS JS files"

              if [ "$BUNDLE_HTML" -eq 0 ] || [ "$BUNDLE_JS" -eq 0 ]; then
                echo "⚠️  WARNING: App bundle may not contain frontend files"
              else
                echo "✅ App bundle contains frontend files"
              fi
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg.sig
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            target/universal-apple-darwin/release/bundle/macos/*.app
          retention-days: 30

