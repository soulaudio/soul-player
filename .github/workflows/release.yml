  # ============================================================================
  # Stage 4: Publish Release
  # ============================================================================

  publish-release:
    name: Publish Release
    needs: [
      create-draft-release,
      test-windows-install,
      test-linux-install,
      test-macos-install
      # test-server-docker  # DISABLED: Server Docker test temporarily disabled
    ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: '${{ needs.create-draft-release.outputs.release-id }}'
            });

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: false
            });

            console.log('✅ Release published successfully!');

      - name: Notify success
        run: |
          echo "🎉 Release ${{ inputs.version || github.ref_name }} published!"
          echo "✅ All installation tests passed"
          echo "📦 Artifacts available on GitHub Releases"
