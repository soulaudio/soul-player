  #     - name: Build Docker image
  #       run: |
  #         docker build -f applications/server/Dockerfile -t soul-server:latest .

  #     - name: Save Docker image
  #       run: |
  #         docker save soul-server:latest > soul-server.tar

  #     - name: Upload Docker image
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: server-docker
  #         path: soul-server.tar
  #         retention-days: 30

  # ============================================================================
  # Stage 2: Create Draft Release
  # ============================================================================

  create-draft-release:
    name: Create Draft Release
    needs: [check-release-exists, build-windows, build-linux-tauri, build-linux-appimage, build-linux-flatpak, build-macos]
    # Continue even if optional Flatpak build fails (it has network sandbox issues)
    if: |
      always() &&
      needs.check-release-exists.outputs.should_continue == 'true' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux-tauri.result == 'success' &&
      needs.build-linux-appimage.result == 'success' &&
      needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
      upload-url: ${{ steps.create-release.outputs.upload_url }}
      tag: ${{ steps.gen-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Generate release tag
        id: gen-tag
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            # For workflow_dispatch without version, use version from config
            VERSION=$(jq -r '.version' .github/release-config.json)
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release info
        id: release-info
        run: |
          VERSION=$(jq -r '.version' .github/release-config.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete all existing releases with same tag
        run: |
          TAG="${{ steps.gen-tag.outputs.tag }}"
          echo "Checking for existing releases with tag: $TAG"

          # Get ALL releases (draft or published) with this tag
          EXISTING_RELEASES=$(gh release list --limit 100 --json tagName,id | \
            jq -r --arg tag "$TAG" '.[] | select(.tagName == $tag) | .id')

          if [ -n "$EXISTING_RELEASES" ]; then
            echo "Found existing release(s) to delete (ensuring clean plate):"
            echo "$EXISTING_RELEASES"

            # Delete by tag (removes both release and tag)
            echo "Deleting release with tag: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || echo "Tag may not exist yet, continuing..."
            echo "✅ Deleted all releases with tag: $TAG"
          else
            echo "No existing releases found for tag $TAG - clean plate ready"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          tag_name: ${{ steps.gen-tag.outputs.tag }}
          name: Soul Player ${{ steps.release-info.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*
          # Flatpak currently disabled due to network sandbox limitations
          fail_on_unmatched_files: false

      - name: Generate latest.json for Tauri updater
        run: |
          VERSION=$(jq -r '.version' .github/release-config.json)
          REPO=$(jq -r '.repository' .github/release-config.json)
          TAG="${{ steps.gen-tag.outputs.tag }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signatures from .sig files
          WINDOWS_SIG=$(cat artifacts/windows-x86_64-pc-windows-msvc/*.exe.sig | tr -d '\n')
          LINUX_SIG=$(cat artifacts/linux-x86_64-unknown-linux-gnu/*.deb.sig | tr -d '\n')
          MACOS_ARM_SIG=$(cat artifacts/macos-aarch64-apple-darwin/*.app.tar.gz.sig | tr -d '\n')
          MACOS_INTEL_SIG=$(cat artifacts/macos-x86_64-apple-darwin/*.app.tar.gz.sig | tr -d '\n')

          # Generate latest.json
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "See release notes for details",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/soul_player_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/soul_player_${VERSION}_amd64.deb"
              },
              "darwin-aarch64": {
                "signature": "${MACOS_ARM_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/soul_player_${VERSION}_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${MACOS_INTEL_SIG}",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/soul_player_${VERSION}_x64.app.tar.gz"
              }
            }
          }
          EOF

          cat latest.json

      - name: Upload latest.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.gen-tag.outputs.tag }} latest.json --clobber

  # ============================================================================
  # Stage 3: Installation Tests (Critical Platforms Only)
  # ============================================================================

  test-windows-install:
    name: Test Windows Installation
    needs: create-draft-release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download installer (Release or Artifact)
        shell: powershell
        env:
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read release config
          $config = Get-Content .github/release-config.json | ConvertFrom-Json
          $version = $config.version
          $nsisName = $config.artifacts.windows.nsis.name -replace '\{version\}', $version
          $artifactName = $config.artifacts.windows.nsis.artifactName

          Write-Host "Expected NSIS installer name: $nsisName"
          Write-Host "Release tag: $env:RELEASE_TAG"

          # Try to download from GitHub Release first (real user experience)
          $downloadUrl = "https://github.com/$($config.repository)/releases/download/$env:RELEASE_TAG/$nsisName"
          Write-Host "`nAttempting to download from release: $downloadUrl"

          try {
            $response = Invoke-WebRequest -Uri $downloadUrl -Method Head -ErrorAction Stop
            Write-Host "✅ Release file exists, downloading..."
            New-Item -ItemType Directory -Force -Path installers | Out-Null
            Invoke-WebRequest -Uri $downloadUrl -OutFile "installers/$nsisName"
            Write-Host "✅ Downloaded from release (testing real user experience)"
          } catch {
            Write-Host "⚠️  Release not available yet, falling back to workflow artifacts"
            Write-Host "Error: $($_.Exception.Message)"

            # Fall back to workflow artifacts
            gh run download ${{ github.run_id }} -n $artifactName -D installers
            Write-Host "✅ Downloaded from workflow artifacts"
          }

      - name: Test NSIS installation
        shell: powershell
        run: |
          $nsis = Get-ChildItem -Path installers -Filter *.exe -Recurse | Select-Object -First 1
          Write-Host "Testing NSIS installer: $($nsis.FullName)"
          Write-Host "File size: $([math]::Round($nsis.Length / 1MB, 2)) MB"

          # Silent install with /S flag (MUST be uppercase!)
          # Note: NSIS doesn't support logging like MSI, but installation is much faster
          Write-Host "Starting NSIS installation (silent mode with embedded WebView2 bootstrapper)..."
          $startTime = Get-Date
          $process = Start-Process $nsis.FullName -ArgumentList "/S" -PassThru -NoNewWindow

          # CRITICAL WORKAROUND: Cache process handle to enable ExitCode property
          # Without this, $process.ExitCode is always $null with -NoNewWindow
          # See: https://github.com/PowerShell/PowerShell/issues/5421
          $null = $process.Handle

          $timeout = 300  # 5 minutes (embedBootstrapper downloads ~2MB WebView2 bootstrapper)

          $elapsed = 0
          while (-not $process.HasExited) {
            Start-Sleep -Seconds 5
            $elapsed = ((Get-Date) - $startTime).TotalSeconds
            Write-Host "Installation in progress... $([math]::Round($elapsed))s elapsed"

            if ($elapsed -gt $timeout) {
              Write-Error "Installation timed out after $timeout seconds"
              $process.Kill()

              # Check if files were partially installed
              if (Test-Path "C:\Program Files\Soul Player") {
                Write-Host "`nPartially installed files:"
                Get-ChildItem "C:\Program Files\Soul Player" -Recurse | Select-Object -First 20
              }
              exit 1
            }
          }

          # Ensure process has fully exited and ExitCode is populated
          $process.WaitForExit()

          $elapsed = ((Get-Date) - $startTime).TotalSeconds
          Write-Host "Installation completed in $([math]::Round($elapsed))s"

          # Check exit code with better null handling
          if ($null -eq $process.ExitCode) {
            Write-Error "Installation failed: Exit code is null (process handle bug)"
            Write-Host "`nThis is a PowerShell bug with -NoNewWindow. Process may have succeeded."
            Write-Host "Checking if app was actually installed..."
          } elseif ($process.ExitCode -ne 0) {
            Write-Error "Installation failed with exit code: $($process.ExitCode)"
            Write-Host "`nNote: NSIS exit codes: 0=success, 1=install error, 2=user cancelled"
            exit 1
          } else {
            Write-Host "✅ NSIS installation exited successfully (code: $($process.ExitCode))"
          }

          # Get installation path from registry (NSIS currentUser installs to HKCU, not HKLM)
          Write-Host "`nFinding installation path from registry..."
          $uninstallReg = $null

          # Check HKCU first (currentUser mode - default for NSIS)
          # Note: App name is "Soul Player" (with space)
          $uninstallReg = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Soul Player*" } | Select-Object -First 1

          if (-not $uninstallReg) {
            # Fallback to HKLM (perMachine mode)
            $uninstallReg = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like "*Soul Player*" } | Select-Object -First 1
          }

          if (-not $uninstallReg -or -not $uninstallReg.InstallLocation) {
            Write-Error "Installation failed: App not found in registry"
            Write-Host "`nChecking common installation paths:"
            Write-Host "  HKCU paths with 'Soul Player':"
            Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName } |
              Select-Object DisplayName, InstallLocation |
              Format-Table
            Write-Host "  AppData: $(Test-Path "$env:LOCALAPPDATA\Soul Player")"
            Write-Host "  Program Files: $(Test-Path "C:\Program Files\Soul Player")"
            exit 1
          }

          # Remove quotes and trailing backslashes from registry path
          $installPath = $uninstallReg.InstallLocation.Trim('"').TrimEnd('\')
          Write-Host "✅ Found installation at: $installPath"
          Write-Host "   Registry key: $($uninstallReg.PSPath)"

          # Verify installation
          $exePath = Join-Path $installPath "soul-player.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Installation failed: soul-player.exe not found at $exePath"
            Write-Host "`nInstallation directory contents:"
            Get-ChildItem $installPath -Recurse | Select-Object -First 30
            exit 1
          }

          Write-Host "✅ Installation successful (took $([math]::Round($elapsed))s)"

          # Note: Tauri embeds frontend files directly in the binary executable
          # They are NOT stored as separate files in the installation directory
          # This is the same architecture as macOS - frontend is compiled into the .exe
          Write-Host "`n✅ Frontend files are embedded in soul-player.exe (not separate files)"

          # Verify the executable exists and has reasonable size (should include embedded frontend)
          $exeSize = (Get-Item $exePath).Length / 1MB
          Write-Host "Binary size: $([math]::Round($exeSize, 2)) MB (includes embedded frontend)"

          if ($exeSize -lt 5) {
            Write-Error "❌ ERROR: Binary is too small ($([math]::Round($exeSize, 2)) MB), may be missing frontend"
            exit 1
          }

          # Test app launch (optional - expected to fail in CI due to no audio devices)
          Write-Host "`nTesting application launch (may fail due to missing audio devices in CI)..."
          try {
            $appProcess = Start-Process $exePath -ArgumentList "--logs" -PassThru -ErrorAction Stop

            # Wait 10 seconds to see if app crashes
            Start-Sleep -Seconds 10

            if ($appProcess.HasExited) {
              $exitCode = $appProcess.ExitCode
              Write-Host "⚠️  App exited with code: $exitCode"

              # Exit code 101 is expected in CI (no audio device for PlaybackManager)
              if ($exitCode -eq 101) {
                Write-Host "✅ Exit code 101 is expected in CI (no audio devices)"
                Write-Host "   This confirms the binary is working correctly"
                Write-Host "   The app requires audio output devices which aren't available in GitHub Actions"
              } else {
                Write-Host "⚠️  Unexpected exit code: $exitCode"
                Write-Host "   Checking logs for details..."

                # Check for log files
                $logPaths = @(
                  "$env:APPDATA\Soul Player\logs",
                  "$env:LOCALAPPDATA\Soul Player\logs"
                )

                foreach ($logPath in $logPaths) {
                  if (Test-Path $logPath) {
                    Write-Host "Logs found at: $logPath"
                    Get-ChildItem $logPath -Filter "*.log" | ForEach-Object {
                      Write-Host "`n--- $($_.Name) ---"
                      Get-Content $_.FullName | Select-Object -Last 50
                    }
                  }
                }
              }
            } else {
              Write-Host "✅ App is still running (PID: $($appProcess.Id))"
              Write-Host "   Stopping app for cleanup..."
              Stop-Process -Id $appProcess.Id -Force
            }
          } catch {
            Write-Host "⚠️  Failed to start app: $_"
            Write-Host "   This may be expected in CI environments"
          }

          # Test uninstall
          Write-Host "Testing uninstall..."

          # Use the uninstaller from the registry entry we found during installation check
          if ($uninstallReg -and $uninstallReg.UninstallString) {
            Write-Host "Using uninstaller: $($uninstallReg.UninstallString)"
            if ($uninstallReg.UninstallString -like "*msiexec*") {
              # MSI uninstall
              $productCode = $uninstallReg.PSChildName
              $uninstallProcess = Start-Process msiexec.exe -ArgumentList "/x", $productCode, "/qn", "/norestart", "/L*V", "uninstall.log" -PassThru -NoNewWindow
            } else {
              # NSIS uninstall
              $uninstallProcess = Start-Process -FilePath $uninstallReg.UninstallString -ArgumentList "/S" -PassThru -NoNewWindow
            }

            # WORKAROUND: Cache handle for ExitCode (same PowerShell bug as install)
            $null = $uninstallProcess.Handle

            $timeout = 180  # 3 minutes for uninstall
            if (-not $uninstallProcess.WaitForExit($timeout * 1000)) {
              Write-Error "Uninstall timed out after $timeout seconds"
              $uninstallProcess.Kill()
              exit 1
            }

            Write-Host "Uninstall process exited with code: $($uninstallProcess.ExitCode)"
          } else {
            Write-Error "Cannot uninstall: No uninstaller found in registry"
            exit 1
          }

          Start-Sleep -Seconds 5

          # Verify complete removal (use the actual install path we found)
          $stillInstalled = Test-Path $installPath
          if ($stillInstalled) {
            Write-Error "Uninstall failed: files still present"
            Get-Content uninstall.log
            exit 1
          }

          # Verify shortcuts removed (check both per-user and per-machine locations)
          $perUserShortcut = Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Soul Player.lnk"
          $perMachineShortcut = Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Soul Player.lnk"

          if ($perUserShortcut -or $perMachineShortcut) {
            Write-Error "Uninstall incomplete: Start Menu shortcut still exists"
            Write-Host "  Per-user shortcut: $perUserShortcut"
            Write-Host "  Per-machine shortcut: $perMachineShortcut"
            exit 1
          }

          Write-Host "✅ Uninstall successful - all files and shortcuts removed"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: "*.log"
          retention-days: 7

  test-linux-install:
    name: Test Linux Installation
    needs: create-draft-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download installer (Release or Artifact)
        env:
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read release config
          CONFIG=$(cat .github/release-config.json)
          VERSION=$(echo "$CONFIG" | jq -r '.version')
          DEB_NAME=$(echo "$CONFIG" | jq -r '.artifacts.linux.deb.name' | sed "s/{version}/$VERSION/")
          ARTIFACT_NAME=$(echo "$CONFIG" | jq -r '.artifacts.linux.deb.artifactName')
          REPO=$(echo "$CONFIG" | jq -r '.repository')

          echo "Expected DEB name: $DEB_NAME"
          echo "Release tag: $RELEASE_TAG"

          # Try to download from GitHub Release first (real user experience)
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$RELEASE_TAG/$DEB_NAME"
          echo ""
          echo "Attempting to download from release: $DOWNLOAD_URL"

          mkdir -p installers
          if curl -fsSL -o "installers/$DEB_NAME" "$DOWNLOAD_URL" 2>/dev/null; then
            echo "✅ Downloaded from release (testing real user experience)"
          else
            echo "⚠️  Release not available yet, falling back to workflow artifacts"

            # Fall back to workflow artifacts
            gh run download ${{ github.run_id }} -n "$ARTIFACT_NAME" -D installers
            echo "✅ Downloaded from workflow artifacts"
          fi

      - name: Test DEB installation
        run: |
          set +e  # Don't exit on error, we'll handle it manually

          DEB=$(find installers -name "*.deb" -type f | head -1)
          echo "Testing DEB: $DEB"

          # Update package index before installing dependencies
          sudo apt-get update

          # Install - dpkg may fail with dependencies, apt-get will fix them
          sudo dpkg -i "$DEB"
          if [ $? -ne 0 ]; then
            echo "dpkg reported dependency issues, fixing with apt-get..."
            sudo apt-get install -f -y
            if [ $? -ne 0 ]; then
              echo "ERROR: apt-get install -f failed"
              exit 1
            fi
          fi

          # Verify package is installed
          if ! dpkg -l soul-player | grep -q '^ii'; then
            echo "ERROR: Package soul-player not installed properly"
            dpkg -l | grep soul
            exit 1
          fi

          echo "✅ Installation successful"
          set -e  # Re-enable exit on error

          # Debug: List installed files
          echo "DEBUG: Installed files from soul-player package:"
          dpkg -L soul-player

          echo "DEBUG: Checking /usr/bin for soul-player binary:"
          ls -la /usr/bin/ | grep -i soul || echo "No soul-player binary found in /usr/bin"

          # Verify binary exists and is executable
          if ! command -v soul-player; then
            echo "ERROR: soul-player not found in PATH"
            echo "PATH: $PATH"
            echo "All installed files:"
            dpkg -L soul-player
            exit 1
          fi

          # Verify binary is executable
          if ! test -x /usr/bin/soul-player; then
            echo "ERROR: soul-player is not executable"
            ls -la /usr/bin/soul-player
            exit 1
          fi

          echo "✅ Binary installed and executable"

          # Verify frontend files are bundled
          echo ""
          echo "Verifying frontend files are bundled..."
          INSTALLED_FILES=$(dpkg -L soul-player)

          # Check for index.html or other frontend assets
          if ! echo "$INSTALLED_FILES" | grep -q -E "(index\.html|\.js|\.css)"; then
            echo "⚠️  WARNING: No frontend files detected in installation"
            echo "First 30 installed files:"
            echo "$INSTALLED_FILES" | head -30
          else
            echo "✅ Frontend files detected"
            echo "Sample frontend files:"
            echo "$INSTALLED_FILES" | grep -E "(\.html|\.js|\.css)" | head -10
          fi

          # Install xvfb for headless testing
          echo ""
          echo "Setting up headless display for app testing..."
          sudo apt-get install -y xvfb

          # Launch app with xvfb (headless X server)
          echo "Testing application launch..."
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          XVFB_PID=$!
          sleep 2

          # Start the app in background with logging enabled
          soul-player --logs > /tmp/soul-player.log 2>&1 &
          APP_PID=$!
          echo "App started with PID: $APP_PID"

          # Wait 10 seconds and check if still running
          sleep 10

          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "❌ App crashed or exited"
            echo "Exit code: $?"
            echo ""
            echo "Console output:"
            cat /tmp/soul-player.log || echo "No log found"

            # Check for application log files
            if [ -d "$HOME/.config/soul-player/logs" ]; then
              echo ""
              echo "Application logs:"
              find "$HOME/.config/soul-player/logs" -name "*.log" -exec echo "--- {} ---" \; -exec tail -50 {} \;
            fi

            kill $XVFB_PID 2>/dev/null || true
            exit 1
          fi

          echo "✅ App is running (PID: $APP_PID)"

          # Check logs for errors/warnings even if app is running
          echo ""
          echo "Checking application logs for errors..."
          if [ -d "$HOME/.config/soul-player/logs" ]; then
            if find "$HOME/.config/soul-player/logs" -name "*.log" -exec grep -i -E "error|fatal|panic" {} \; | head -10; then
              echo "⚠️  Errors found in logs (app still running)"
            else
              echo "✅ No errors in logs"
            fi
          fi

          # Kill the app and xvfb
          echo "Stopping application..."
          kill $APP_PID 2>/dev/null || true
          kill $XVFB_PID 2>/dev/null || true
          sleep 2
          echo "✅ App stopped"

          # Uninstall
          sudo apt-get purge -y soul-player

          # Verify complete removal
          ! command -v soul-player || exit 1
          ! test -f /usr/share/applications/soul-player.desktop || exit 1
          echo "✅ Uninstall successful - all files removed"

  test-macos-install:
    name: Test macOS Installation
    needs: create-draft-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download installer (Release or Artifact)
        env:
          RELEASE_TAG: ${{ needs.create-draft-release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read release config
          CONFIG=$(cat .github/release-config.json)
          VERSION=$(echo "$CONFIG" | jq -r '.version')
          DMG_NAME=$(echo "$CONFIG" | jq -r '.artifacts.macos."dmg-arm".name' | sed "s/{version}/$VERSION/")
          ARTIFACT_NAME=$(echo "$CONFIG" | jq -r '.artifacts.macos."dmg-arm".artifactName')
          REPO=$(echo "$CONFIG" | jq -r '.repository')

          echo "Expected DMG name: $DMG_NAME"
          echo "Release tag: $RELEASE_TAG"

          # Try to download from GitHub Release first (real user experience)
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$RELEASE_TAG/$DMG_NAME"
          echo ""
          echo "Attempting to download from release: $DOWNLOAD_URL"

          mkdir -p installers
          if curl -fsSL -o "installers/$DMG_NAME" "$DOWNLOAD_URL" 2>/dev/null; then
            echo "✅ Downloaded from release (testing real user experience)"
          else
            echo "⚠️  Release not available yet, falling back to workflow artifacts"

            # Fall back to workflow artifacts
            gh run download ${{ github.run_id }} -n "$ARTIFACT_NAME" -D installers
            echo "✅ Downloaded from workflow artifacts"
          fi

      - name: Test DMG installation
        run: |
          DMG=$(find installers -name "*.dmg" -type f | head -1)
          echo "Testing DMG: $DMG"

          # Mount DMG
          hdiutil attach "$DMG"
          VOLUME=$(ls /Volumes | grep -i "soul" | head -1)

          echo "Volume found: $VOLUME"
          echo "Contents of /Volumes/$VOLUME:"
          ls -la "/Volumes/$VOLUME/"

          # Copy app to Applications (note: app name is "Soul Player.app" with space)
          APP_NAME="Soul Player.app"
          if [ ! -d "/Volumes/$VOLUME/$APP_NAME" ]; then
            echo "❌ Error: $APP_NAME not found in DMG"
            echo "Available files:"
            ls -la "/Volumes/$VOLUME/"
            exit 1
          fi

          cp -R "/Volumes/$VOLUME/$APP_NAME" /Applications/
          echo "✅ Installation successful"

          # Verify code signature after installation
          echo ""
          echo "Verifying code signature of installed app..."
          codesign -dv --verbose=4 "/Applications/$APP_NAME" 2>&1 | head -20

          # Check if quarantine attribute is set (simulates user download)
          echo ""
          echo "Checking quarantine attributes..."
          xattr "/Applications/$APP_NAME" || echo "No extended attributes found"

          # If quarantine is set, remove it (this is what users need to do)
          if xattr "/Applications/$APP_NAME" | grep -q "com.apple.quarantine"; then
            echo "⚠️  Quarantine attribute detected (would cause 'damaged' error)"
            echo "Removing quarantine attribute (xattr -cr)..."
            xattr -cr "/Applications/$APP_NAME"
            echo "✅ Quarantine attribute removed"
          else
            echo "✓ No quarantine attribute (CI environment doesn't set it)"
          fi

          # Verify app bundle structure
          test -d "/Applications/$APP_NAME/Contents/MacOS" || exit 1
          test -f "/Applications/$APP_NAME/Contents/Info.plist" || exit 1
          echo "✅ App bundle structure verified"

          # Print Info.plist for debugging
          echo ""
          echo "Info.plist contents:"
          plutil -p "/Applications/$APP_NAME/Contents/Info.plist"

          # Note: Tauri embeds frontend files directly in the binary executable
          # They are NOT stored as separate files in Contents/Resources
          # This is different from Electron which stores files separately
          echo ""
          echo "✅ Frontend files are embedded in the binary (not in Resources folder)"
          echo ""
          echo "App bundle structure:"
          find "/Applications/$APP_NAME/Contents" -maxdepth 2 -type d | sort
          echo ""
          echo "Binary size (should be larger due to embedded frontend):"
          ls -lh "/Applications/$APP_NAME/Contents/MacOS/soul-player"

          # Check if app would appear in Launchpad
          plutil -p "/Applications/$APP_NAME/Contents/Info.plist" | grep -q "CFBundleIdentifier" || exit 1
          echo "✅ App metadata verified"

          # Test app launch
          echo ""
          echo "Testing application launch..."

          # Launch app using direct path (more reliable than 'open -a')
          # macOS requires the binary to be in Contents/MacOS/
          "/Applications/$APP_NAME/Contents/MacOS/soul-player" --logs 2>&1 &
          APP_PID=$!

          # Wait a few seconds for app to start
          sleep 5

          # Check if app is running via process list (look for the binary name)
          APP_RUNNING=$(ps aux | grep -E "soul-player|Soul Player" | grep -v grep | wc -l)

          if [ "$APP_RUNNING" -eq 0 ]; then
            echo "❌ App failed to launch or crashed immediately"

            # Check for log files
            LOG_DIR="$HOME/Library/Logs/soul-player"
            if [ -d "$LOG_DIR" ]; then
              echo ""
              echo "Application logs in ~/Library/Logs:"
              find "$LOG_DIR" -name "*.log" -exec echo "--- {} ---" \; -exec tail -50 {} \;
            fi

            # Check Application Support
            APP_SUPPORT="$HOME/Library/Application Support/soul-player"
            if [ -d "$APP_SUPPORT/logs" ]; then
              echo ""
              echo "App Support logs:"
              find "$APP_SUPPORT/logs" -name "*.log" -exec echo "--- {} ---" \; -exec tail -50 {} \;
            fi

            exit 1
          fi

          echo "✅ App launched successfully ($APP_RUNNING process(es) running)"

          # Wait a bit more to ensure stability
          sleep 5

          APP_RUNNING=$(ps aux | grep -E "soul-player|Soul Player" | grep -v grep | wc -l)
          if [ "$APP_RUNNING" -eq 0 ]; then
            echo "❌ App crashed after initial launch"
            exit 1
          fi

          echo "✅ App stable after 10 seconds"

          # Check logs for errors/warnings even if app is running
          echo ""
          echo "Checking application logs for errors..."
          LOG_DIR="$HOME/Library/Application Support/soul-player/logs"
          if [ -d "$LOG_DIR" ]; then
            if find "$LOG_DIR" -name "*.log" -exec grep -i -E "error|fatal|panic" {} \; | head -10; then
              echo "⚠️  Errors found in logs (app still running)"
            else
              echo "✅ No errors in logs"
            fi
          else
            echo "ℹ️  No log directory found (app may not have logging enabled)"
          fi

          # Kill the app
          echo "Stopping application..."
          killall "soul-player" 2>/dev/null || true
          sleep 2
          echo "✅ App stopped"

          # Uninstall - just remove the app bundle
          hdiutil detach "/Volumes/$VOLUME"
          rm -rf "/Applications/Soul Player.app"

          # Verify complete removal
          ! test -d "/Applications/Soul Player.app" || exit 1
          echo "✅ Uninstall successful - app bundle removed"

          # Note: On macOS, users may need to manually remove:
          # - ~/Library/Application Support/soul-player
          # - ~/Library/Preferences/com.soul-player.plist
          # - ~/Library/Caches/soul-player
          echo "ℹ️  User data would remain in ~/Library (as expected on macOS)"

