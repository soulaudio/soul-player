  # ============================================================================
  # Stage 2: Create Draft Release
  # ============================================================================

  create-draft-release:
    name: Create Draft Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create-release.outputs.id }}
      upload-url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        id: release-notes
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          cat > release-notes.md << EOF
          ## Soul Player Release $VERSION

          ### 📦 Downloads

          #### Desktop Applications
          - **Windows**:
            - \`.msi\` - Windows Installer (recommended)
            - \`.exe\` - Portable executable (NSIS)
          - **Linux**:
            - \`.deb\` - Debian/Ubuntu package
            - \`.rpm\` - Fedora/RHEL package
            - \`.AppImage\` - Universal Linux binary
          - **macOS**:
            - \`.dmg\` - macOS disk image
            - Universal binary (Intel + Apple Silicon)

          #### Server
          - **Docker**: \`soul-server:latest\`

          ### 🚀 Installation

          See [docs/LINUX_PACKAGING.md](https://github.com/yourusername/soul-player/blob/main/docs/LINUX_PACKAGING.md) for installation instructions.

          ### 📝 Changelog

          See [CHANGELOG.md](https://github.com/yourusername/soul-player/blob/main/CHANGELOG.md) for detailed changes.

          ---

          **Build Info**:
          - Built with: Rust \`stable\`, release mode
          - Optimizations: LTO enabled, codegen-units=1
          - Tested on: Windows 11, Ubuntu 22.04, macOS 14+
          EOF

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
          name: Release ${{ inputs.version || github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/**/*
          fail_on_unmatched_files: false

  # ============================================================================
  # Stage 3: Installation Tests (Critical Platforms Only)
  # ============================================================================

  test-windows-install:
    name: Test Windows Installation
    needs: create-draft-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-pc-windows-msvc
          path: installers

      - name: Test MSI installation
        shell: powershell
        run: |
          $msi = Get-ChildItem -Path installers -Filter *.msi | Select-Object -First 1
          Write-Host "Testing MSI: $($msi.FullName)"

          # Silent install
          Start-Process msiexec.exe -ArgumentList "/i", $msi.FullName, "/qn", "/L*V", "install.log" -Wait

          # Verify installation
          $installed = Test-Path "C:\Program Files\Soul Player\soul-player.exe"
          if (-not $installed) {
            Write-Error "Installation failed: soul-player.exe not found"
            Get-Content install.log
            exit 1
          }

          Write-Host "✅ Installation successful"

          # Test uninstall
          Start-Process msiexec.exe -ArgumentList "/x", $msi.FullName, "/qn" -Wait
          Start-Sleep -Seconds 5

          $stillInstalled = Test-Path "C:\Program Files\Soul Player"
          if ($stillInstalled) {
            Write-Error "Uninstall failed: files still present"
            exit 1
          }

          Write-Host "✅ Uninstall successful"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: "*.log"
          retention-days: 7

  test-linux-install:
    name: Test Linux Installation
    needs: create-draft-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-unknown-linux-gnu
          path: installers

      - name: Test DEB installation
        run: |
          cd installers
          DEB=$(ls *.deb | head -1)
          echo "Testing DEB: $DEB"

          # Install
          sudo dpkg -i $DEB || sudo apt-get install -f -y
          echo "✅ Installation successful"

          # Verify
          command -v soul-player || exit 1
          soul-player --version || exit 1
          echo "✅ Application launches"

          # Uninstall
          sudo apt-get purge -y soul-player
          ! command -v soul-player || exit 1
          echo "✅ Uninstall successful"

  test-macos-install:
    name: Test macOS Installation
    needs: create-draft-release
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64-apple-darwin
          path: installers

      - name: Test DMG installation
        run: |
          cd installers
          DMG=$(ls *.dmg | head -1)
          echo "Testing DMG: $DMG"

          # Mount DMG
          hdiutil attach "$DMG"
          VOLUME=$(ls /Volumes | grep -i "soul" | head -1)

          # Copy app
          cp -R "/Volumes/$VOLUME/Soul Player.app" /Applications/
          echo "✅ Installation successful"

          # Verify (may fail on ARM runner, continue anyway)
          /Applications/Soul\ Player.app/Contents/MacOS/soul-player --version || echo "⚠️  Version check skipped (cross-arch)"

          # Cleanup
          hdiutil detach "/Volumes/$VOLUME"
          rm -rf "/Applications/Soul Player.app"
          echo "✅ Cleanup successful"

