name: CI

# NOTE: This workflow uses direct cargo commands instead of Moon task runner
# to avoid issues with shallow git checkouts in GitHub Actions. For local
# development, you can use Moon commands (e.g., `moon run :lint`) which are
# configured identically in moon.yml at the repository root.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Optimize builds for CI
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # ============================================================================
  # Disk Space Management (Run First)
  # ============================================================================

  cleanup:
    name: Free Disk Space
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h

          # Remove unnecessary preinstalled tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          echo "Disk after cleanup:"
          df -h

  # ============================================================================
  # Code Quality Checks
  # ============================================================================

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Increase cache efficiency
          shared-key: "clippy"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # Create mock dist directory for Tauri's generate_context!() macro
      - name: Create mock frontend dist
        run: |
          mkdir -p applications/desktop/dist
          echo '<!DOCTYPE html><html><head><title>Soul Player</title></head><body><div id="root">Loading...</div></body></html>' > applications/desktop/dist/index.html
          mkdir -p applications/desktop/src-tauri/dist
          cp applications/desktop/dist/index.html applications/desktop/src-tauri/dist/

      - name: Run Clippy
        run: cargo clippy --workspace --lib --bins --release -- -D warnings

  typescript:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack for Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn

      - name: TypeScript check - Desktop
        run: yarn workspace soul-player-desktop run tsc --noEmit

      - name: TypeScript check - Shared
        run: yarn workspace @soul-player/shared run tsc --noEmit

      - name: TypeScript check - Marketing
        run: yarn workspace @soul-player/marketing run type-check

      - name: Lint - Desktop
        run: yarn workspace soul-player-desktop run lint

      - name: Lint - Shared
        run: yarn workspace @soul-player/shared run lint

      - name: Dead Code Detection (Knip)
        run: yarn knip --no-exit-code
        continue-on-error: true

  # ============================================================================
  # Security
  # ============================================================================

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "audit"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: |
          # Ignore known acceptable advisories from dependencies:
          # - RUSTSEC-2023-0071: rsa timing attack (from sqlx-mysql, not used at runtime)
          # - RUSTSEC-2024-041x: GTK3 unmaintained (from Tauri, waiting for GTK4 migration)
          # - RUSTSEC-2024-0429: glib unsoundness (from Tauri GTK dependencies)
          # - RUSTSEC-2024-0436: paste unmaintained (from lofty metadata library)
          # - RUSTSEC-2024-0370/0437/0438: proc-macro-error unmaintained (from various deps)
          # - RUSTSEC-2025-0057: fxhash unmaintained (from Tauri)
          # - RUSTSEC-2025-007x/008x/010x: unic-* unmaintained (from Tauri)
          # - RUSTSEC-2025-0119: number_prefix unmaintained (from indicatif progress bar)
          # - RUSTSEC-2025-0134: rustls-pemfile unmaintained (from reqwest)
          # - RUSTSEC-2024-0384: instant unmaintained (from notify-types/fastrand)
          # - RUSTSEC-2025-0111: tokio-tar PAX header parsing (from testcontainers, no fix available)
          # - RUSTSEC-2026-0002: lru IterMut unsoundness (TODO: remove desktop Cargo.toml override, use workspace version 0.16)
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2024-0411 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0414 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0417 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0421 \
            --ignore RUSTSEC-2024-0422 \
            --ignore RUSTSEC-2024-0423 \
            --ignore RUSTSEC-2024-0424 \
            --ignore RUSTSEC-2024-0425 \
            --ignore RUSTSEC-2024-0426 \
            --ignore RUSTSEC-2024-0427 \
            --ignore RUSTSEC-2024-0428 \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2024-0437 \
            --ignore RUSTSEC-2024-0438 \
            --ignore RUSTSEC-2025-0057 \
            --ignore RUSTSEC-2025-0075 \
            --ignore RUSTSEC-2025-0080 \
            --ignore RUSTSEC-2025-0081 \
            --ignore RUSTSEC-2025-0098 \
            --ignore RUSTSEC-2025-0100 \
            --ignore RUSTSEC-2025-0119 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2025-0111 \
            --ignore RUSTSEC-2026-0002

  # ============================================================================
  # Build + Test (Combined for Efficiency)
  # ============================================================================

  build-and-test:
    name: Build & Test
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_release: ${{ github.ref == 'refs/heads/main' }}
          - os: macos-latest
            target: x86_64-apple-darwin
            use_release: ${{ github.ref == 'refs/heads/main' }}
          - os: macos-latest
            target: aarch64-apple-darwin
            use_release: ${{ github.ref == 'refs/heads/main' }}
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_release: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Use target-specific cache keys
          key: ${{ matrix.target }}-${{ matrix.use_release && 'release' || 'debug' }}
          shared-key: ${{ matrix.target }}

      # Install system dependencies (Linux)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # Install system dependencies (macOS)
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config

      # Install LLVM for ASIO support (Windows)
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # Create mock dist directory for Tauri
      - name: Create mock frontend dist
        run: |
          mkdir -p applications/desktop/dist
          echo '<!DOCTYPE html><html><head><title>Soul Player</title></head><body><div id="root">Loading...</div></body></html>' > applications/desktop/dist/index.html
          mkdir -p applications/desktop/src-tauri/dist
          cp applications/desktop/dist/index.html applications/desktop/src-tauri/dist/

      # Build in release mode on main, debug mode elsewhere
      - name: Build workspace (Release)
        if: matrix.use_release == true
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Build workspace (Debug)
        if: matrix.use_release != true
        run: cargo build --workspace --target ${{ matrix.target }}

      # Run tests (use same build profile)
      - name: Run unit tests (Release)
        if: matrix.use_release == true
        run: cargo test --workspace --lib --bins --release --target ${{ matrix.target }}
        env:
          RUST_TEST_THREADS: 4

      - name: Run unit tests (Debug)
        if: matrix.use_release != true
        run: cargo test --workspace --lib --bins --target ${{ matrix.target }}
        env:
          RUST_TEST_THREADS: 4

      # Upload artifacts on main branch for release pipeline
      - name: Upload build artifacts (main branch only)
        if: matrix.use_release == true && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: soul-player-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/soul-player*
            target/${{ matrix.target }}/release/*.so
            target/${{ matrix.target }}/release/*.dylib
            target/${{ matrix.target }}/release/*.dll
          retention-days: 7

  # ============================================================================
  # Integration Tests with Testcontainers (Linux only)
  # ============================================================================

  test-containers:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      # Force release mode for tests to reduce binary size
      CARGO_PROFILE_TEST_OPT_LEVEL: 3
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      # Aggressive disk cleanup BEFORE any other steps
      - name: Free disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h

          # Remove unnecessary tools
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          # Remove old package lists
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== Disk space after cleanup ==="
          df -h

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "integration"
          # Save cache even if tests fail (for debugging)
          save-if: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      # Create mock dist directory
      - name: Create mock frontend dist
        run: |
          mkdir -p applications/desktop/dist
          echo '<!DOCTYPE html><html><head><title>Soul Player</title></head><body><div id="root">Loading...</div></body></html>' > applications/desktop/dist/index.html
          mkdir -p applications/desktop/src-tauri/dist
          cp applications/desktop/dist/index.html applications/desktop/src-tauri/dist/

      # Build only integration tests incrementally to manage disk space
      - name: Build integration tests (libraries only)
        run: |
          echo "=== Building library integration tests ==="
          cargo test --tests --release --no-run \
            -p soul-audio \
            -p soul-audio-desktop \
            -p soul-playback \
            -p soul-storage

          echo "=== Disk space after build ==="
          df -h

      # Run tests with minimal parallelism
      - name: Run testcontainer integration tests
        run: |
          echo "=== Running integration tests ==="
          cargo test --tests --release \
            -p soul-audio \
            -p soul-audio-desktop \
            -p soul-playback \
            -p soul-storage \
            -- --test-threads=1
        continue-on-error: false

  # ============================================================================
  # Code Coverage
  # ============================================================================

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Aggressive disk cleanup - coverage builds need space
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

          echo "Disk after cleanup:"
          df -h

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "coverage"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      # Use cargo-llvm-cov (faster and more efficient than tarpaulin)
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Only test libraries (exclude desktop/server apps to save time/space)
      - name: Generate coverage
        run: |
          cargo llvm-cov --workspace \
            --exclude soul-player-desktop \
            --exclude soul-server \
            --lcov --output-path lcov.info \
            --no-fail-fast
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # All Checks Summary (Required for PR merge)
  # ============================================================================

  ci-success:
    name: CI Success
    needs:
      - format
      - clippy
      - audit
      - build-and-test
      - test-containers
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.format.result }}" != "success" || \
                "${{ needs.clippy.result }}" != "success" || \
                "${{ needs.audit.result }}" != "success" || \
                "${{ needs.build-and-test.result }}" != "success" || \
                "${{ needs.test-containers.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed successfully!"

  # ============================================================================
  # Trigger Release Pipeline (main branch only)
  # ============================================================================

  trigger-release:
    name: Trigger Release Pipeline
    needs: ci-success
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger release workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                triggered_by_ci: 'true',
                commit_sha: context.sha
              }
            });
            console.log('✅ Release pipeline triggered for commit:', context.sha);
