name: General Issue
description: Report something that doesn't fit bug or feature categories (documentation, question, etc.)
title: "[Issue]: "
labels: ["triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for general issues, documentation improvements, questions, or anything else that doesn't fit the bug or feature categories.

        **Note**: For technical questions and discussions, consider asking on [Discord](https://discord.gg/pCkTFbY9hC) instead!

  - type: dropdown
    id: type
    attributes:
      label: Issue Type
      description: What type of issue is this?
      options:
        - Documentation
        - Build/Development
        - Configuration
        - Performance
        - Question
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue in detail.
      placeholder: Provide a clear description...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, links, or examples.
      placeholder: Any additional information...
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
